# Builds the downloadable Mac app (with its own Python) on a GitHub Mac.
#   pull requests touching the app: build it and keep the zip as a run artifact, to check before merging
#   a version tag (git tag v1.0.0 && git push --tags): build it and attach it to that release
name: Mac app
on:
  pull_request:
    paths: ['mac/**', 'app/**', 'present.py', '.github/workflows/mac-app.yml']
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pocket Presenter.app with its own Python
        run: WITH_PYTHON=1 mac/make-app.sh "$RUNNER_TEMP/out"
      - name: Check the app starts and serves the drop page
        run: |
          BUNDLE="$RUNNER_TEMP/out/Pocket Presenter.app"; APP="$BUNDLE/Contents/Resources"
          codesign --verify --deep --strict "$BUNDLE" && echo "signature ok after build"
          export PYTHONDONTWRITEBYTECODE=1   # as launch.sh runs it
          "$APP/python/$(uname -m)/bin/python3" "$APP/present.py" --port 8123 --no-open &
          for i in $(seq 1 50); do curl -sf http://localhost:8123/info >/dev/null && break; sleep 0.2; done
          curl -sf http://localhost:8123/drop.html | grep -q 'Drop your deck'
          curl -sf http://localhost:8123/info | grep -q '"relay"'
          kill %1; wait || true
          codesign --verify --deep --strict "$BUNDLE" && echo "signature still ok after running"
      - name: Zip
        run: |
          cd "$RUNNER_TEMP/out"
          ditto -c -k --sequesterRsrc --keepParent "Pocket Presenter.app" "$RUNNER_TEMP/Pocket-Presenter-mac.zip"
          ls -lh "$RUNNER_TEMP/Pocket-Presenter-mac.zip"
      - name: Disk image (drag the app onto Applications)
        run: |
          mkdir "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/out/Pocket Presenter.app" "$RUNNER_TEMP/dmg/Pocket Presenter.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Pocket Presenter" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$RUNNER_TEMP/Pocket-Presenter-mac.dmg"
          ls -lh "$RUNNER_TEMP/Pocket-Presenter-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Presenter-mac
          path: |
            ${{ runner.temp }}/Pocket-Presenter-mac.dmg
            ${{ runner.temp }}/Pocket-Presenter-mac.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Pocket Presenter $GITHUB_REF_NAME" \
              --notes "Download **Pocket-Presenter-mac.dmg**, open it, and drag Pocket Presenter onto Applications (or use the .zip: unzip it and drag the app to Applications). It includes its own Python. The first time you open it, see the README's \"Opening the app the first time\"."
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Pocket-Presenter-mac.dmg" "$RUNNER_TEMP/Pocket-Presenter-mac.zip" --clobber
